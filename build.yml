# Compila el VST3 en un Windows en la nube de GitHub (sin instalar nada en tu PC).
# Sube esta carpeta a un repo de GitHub y mira la pestana Actions.
name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCOPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Fanner3000-VST3
          path: build/Fanner3000_artefacts/Release/VST3/
